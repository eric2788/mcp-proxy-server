version: '3.8'
services:
  mcp-api:
    build: .
    ports:
      - "3006:3006"  # SSE server
    environment:
      - NODE_ENV=production
      - KEEP_SERVER_OPEN=1
    volumes:
      - ./config.json:/app/config.json
    command: ["/app/start-sse.sh"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3006/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mcp-web:
    build: .
    ports:
      - "3000:3000"  # Next.js app
    environment:
      - NODE_ENV=production
      - WEB_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://mcp-api:3006/api
    command: ["/app/start-app.sh"]
    depends_on:
      mcp-api:
        condition: service_healthy
    restart: unless-stopped